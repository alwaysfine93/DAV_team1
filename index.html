<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>놀 시간 · 장소 · 경로 추천</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {background:#f7fbff;font-family:'Malgun Gothic',Arial,sans-serif;}
    .app-wrap {max-width:410px;margin:24px auto 18px;border:2px solid #203157;border-radius:28px;background:#fff;box-shadow:0 7px 32px rgba(44,54,64,.13);}
    .screen {display:none;}
    .screen.active {display:block;}
    .mobile-bar {height:40px; border-radius:20px 20px 0 0; background:#fff;border-bottom:1.6px solid #e3ecf4; display:flex; align-items:center; justify-content:space-between; padding:0 18px;}
    .scr-title {font-size:19px;color:#233;font-weight:bold;}
    .fn-tag {background:#ffe082;color:#795000;font-size:15px;font-weight:bold;border-radius:50%;border:1.2px solid #f2c100;padding:2px 12px;margin-left:7px;}
    .area{padding:14px 19px 13px 19px;margin:12px 8px 12px 8px;border:1.3px dashed #7cb7ef; border-radius:12px; background:#f7fbff;}
    .name-row {margin:18px 0 13px 0;display:flex;align-items:center;}
    .name-ico {width:46px; height:46px; border-radius:50%; background:#e3eaf0; margin-right:13px;
      display:flex;align-items:center;justify-content:center;font-size:25px;}
    .name-inp {font-size:19px; font-weight:bold; border:none; border-bottom:1.5px solid #959ec8;
      outline:none;width:77%;background:transparent;color:#29405b;}
    .main-msgbtn {display:block;width:100%;font-size:17px;padding:12px 0;margin:12px 0 7px 0;
      border-radius:8px;border:none;}
    .now-notice {background:#ef5350;color:#fff;font-size:17px;margin:7px 0;padding:10px;border-radius:8px;}
    .study-notice {background:#d32f2f;color:#fff;font-size:16px;padding:8px;border-radius:7px;margin:2px 0 8px;}
    .ok-msg {background:#4caf50;color:#fff;font-weight:bold;}
    .list-btn {background:#1976d2;color:#fff;}
    .rest-msg {background:#eafbe1;color:#528435;font-size:15px;padding:8px 10px;border-radius:7px;margin:5px 0;}
    .menu-bar {display: flex; justify-content: space-between; background: #e0f1db; border-radius: 0 0 19px 19px; padding: 6px 17px 8px 17px; font-size: 16px; font-weight:bold; color: #43632e;margin:0;}
    .menu-bar button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;}
    .tab-link{color:#8eaf6d;}
    .backbtn{font-size:15px;background:none;border:none;color:#4282d6;margin-bottom:7px;cursor:pointer;}
    .selectbox{width:100%; font-size:17px; padding:7px; border-radius:8px; border:1.3px solid #aac;}
    .place-btn{background:#1976d2;color:#fff;font-size:18px;width:100%;padding:13px 0;margin:9px 0 7px 0;border-radius:8px;border:none;}
    .rand-place {background:#ffe082;color:#425109;padding:5px 10px;border-radius:7px; font-weight:bold;display:inline-block;}
    .place-list {font-size:16px;margin:8px 0 6px 2px;}
    .place-li {border-bottom: 1px dashed #bae;border-radius:3px;padding:3px;}
    .guideimg{color:#bababa;text-align:center;margin:14px;}
    .urlbox{margin:15px 0 0 0; word-break:break-all; font-size:15px;}
    .dest-label{background:#efefef; color:#333; font-size:15px; padding:4px 6px; border-radius:6px; margin:0;}
    .route-btn{background:#ef5350; color:#fff; border:none; font-size:17px;width:100%;padding:12px;margin:13px 0 7px 0;border-radius:8px;}
    @media (max-width:450px) {.app-wrap{max-width:99vw}.area{padding:7px;}}
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- Home/메인 -->
    <div id="screen_home" class="screen active">
      <div class="mobile-bar"><span class="scr-title">홈</span></div>
      <div class="area">
        <div class="name-row">
          <div class="name-ico">👤</div>
          <input type="text" id="userName" class="name-inp" placeholder="이름" maxlength="8" oninput="saveName()" autocomplete="off">
        </div>
        <button id="btn_now" class="main-msgbtn now-notice" disabled>지금은 놀 수 있는 시간이 아닙니다</button>
        <div id="time_left" class="rest-msg"></div>
        <button id="btn_study" class="main-msgbtn study-notice" style="display:none;" disabled>지금은 공부할 시간입니다</button>
        <div id="study_left" class="rest-msg" style="display:none;"></div>
        <button class="main-msgbtn list-btn" onclick="moveScreen('playtime')">놀 장소 찾기</button>
      </div>
      <div class="menu-bar">
        <span>홈</span><span>공부 계획</span><span>놀 장소</span><span>최적경로</span>
      </div>
    </div>
    <!-- 놀 시간 찾기 (F1) -->
    <div id="screen_playtime" class="screen">
      <div class="mobile-bar"><span class="scr-title">놀 시간 찾기</span> <span class="fn-tag">F1</span></div>
      <div class="area" style="margin-top:13px;">
        <b>총 놀 수 있는 시간은: <span id="total_playtime"></span></b>
        <ul id="list_free" style="margin:14px 0 5px 0; padding-left:21px; font-size:16px;"></ul>
        <div id="now_labelbox"></div>
        <button class="main-msgbtn list-btn" onclick="moveScreen('place')">놀 장소 추천으로 이동</button>
      </div>
      <div class="menu-bar">
        <button class="tab-link" onclick="moveScreen('home')">홈</button>
        <span>공부 계획</span>
        <span>놀 장소</span>
        <span>최적경로</span>
      </div>
    </div>
    <!-- 놀이 장소 추천 (F6) -->
    <div id="screen_place" class="screen">
      <div class="mobile-bar"><span class="scr-title">놀이 장소 추천</span> <span class="fn-tag">F6</span></div>
      <div class="area">
        <button class="backbtn" onclick="moveScreen('playtime')">돌아가기</button>
        <div style="font-size:14px;color:#666;">고르기에서 장소를 고르시면 놀이 장소를 추천해드립니다.</div>
        <select id="catSel" class="selectbox" style="margin:9px 0 12px 0;" onchange="listPlaces()">
          <option value="" hidden>고르기</option>
        </select>
        <button class="place-btn" onclick="pickRandomPlace()">놀이 장소 추천 찾기</button>
        <div id="rec_placebox" class="place-list"></div>
        <div class="guideimg">그림 · 사진</div>
        <button class="main-msgbtn list-btn" style="margin-top:14px;" onclick="moveScreen('route')">최적 경로 찾기</button>
      </div>
      <div class="menu-bar">
        <button class="tab-link" onclick="moveScreen('home')">홈</button>
        <button class="tab-link" onclick="moveScreen('playtime')">공부 계획</button>
        <span>놀 장소</span>
        <span>최적경로</span>
      </div>
    </div>
    <!-- 최적 경로 찾기 화면 -->
    <div id="screen_route" class="screen">
      <div class="mobile-bar"><span class="scr-title">최적 경로 찾기</span> <span class="fn-tag">F3</span></div>
      <div class="area">
        <label style="font-size:15px;">출발 장소</label>
        <input type="text" id="startInput" class="selectbox" placeholder="여기에 입력" autocomplete="off">
        <div class="dest-label" style="margin:10px 0 4px 0;">
          목적지(추천 놀이 장소): <b id="destLabel"></b>
        </div>
        <button class="route-btn" onclick="showNaverRoute()">입력</button>
        <div class="urlbox" id="routeUrlBox"></div>
      </div>
      <div class="menu-bar">
        <button class="tab-link" onclick="moveScreen('home')">홈</button>
        <button class="tab-link" onclick="moveScreen('playtime')">공부 계획</button>
        <button class="tab-link" onclick="moveScreen('place')">놀 장소</button>
        <span>최적경로</span>
      </div>
    </div>
  </div>
  <script>
    // 저장/불러오기
    const LS_KEY = 'applog_v3_state';
    let state = { name:'', plans:[], lastCat:'', lastPlace:'' };
    function saveAll(){
      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
      catch(e){
        alert('저장 공간에 저장할 수 없는 환경(Incognito 등)입니다.');
      }
    }
    function loadAll(){
      try{
        const s = localStorage.getItem(LS_KEY);
        if(s) state = JSON.parse(s);
      }catch{}
    }
    // 이름 저장
    function pad(n){return n<10?'0'+n:n;}
    function saveName(){
      state.name = document.getElementById('userName').value.trim();
      saveAll();
    }
    // 놀 시간 파이썬 규칙
    function time2min(str){
      let [h,m] = str.split(':').map(Number); return h*60+m;
    }
    function min2time(m){
      let h=Math.floor(m/60), mm=m%60;
      if(h<0) h=0; if(h>23) h=23; if(mm>59) mm=59;if(mm<0) mm=0;
      return pad(h)+":"+pad(mm);
    }
    function find_free_time(plans) {
      function t2m(t){let [h,m]=t.split(":").map(Number);return h*60+m;}
      function m2t(m){let h = Math.floor(m/60), mm = m % 60;return pad(h)+":"+pad(mm);}
      let sorted_plans = plans.slice().sort((a,b)=>t2m(a.start)-t2m(b.start));
      let free_times = [], DAY_START=0, DAY_END=24*60-1;
      let current = DAY_START;
      for(let plan of sorted_plans){
        let start = t2m(plan.start), end = t2m(plan.end);
        if(start > current){
          let duration = start - current;
          if(duration >= 10){
            free_times.push({start:m2t(current), end:m2t(start), duration:duration});
          }
        }
        current = Math.max(current, end);
      }
      if(current <= DAY_END){
        let duration = DAY_END+1 - current;
        if(duration >= 10){
          free_times.push({
            start: m2t(current),
            end: m2t(DAY_END+1 <= 24*60-1 ? DAY_END+1 : 24*60-1),
            duration: duration
          });
        }
      }
      return free_times;
    }
    function now_in_free(free){
      let now = new Date();
      let m = now.getHours()*60 + now.getMinutes();
      for(let f of free){
        if(m >= time2min(f.start) && m < time2min(f.end)){
          return {ok:true, left: time2min(f.end)-m};
        }
      }
      // 공부 구간 찾기
      let study = state.plans
        .find(p=>m>=time2min(p.start) && m<time2min(p.end));
      if(study) return {ok: false, study:true, left:time2min(study.end)-m};
      let next = free.find(f=>time2min(f.start)>m);
      if(next) return {ok:false, next:true, left:time2min(next.start)-m};
      return {ok:false, left:0};
    }
    // 화면 전환
    function moveScreen(n){
      document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
      if(n==='home') { renderHome(); document.getElementById('screen_home').classList.add('active'); }
      if(n==='playtime') { renderPlaytime(); document.getElementById('screen_playtime').classList.add('active'); }
      if(n==='place') { renderPlaceCats(); document.getElementById('screen_place').classList.add('active'); }
      if(n==='route') { renderRoute(); document.getElementById('screen_route').classList.add('active'); }
    }
    // 홈
    function renderHome(){
      document.getElementById('userName').value = state.name||'';
      let plans = state.plans||[];
      let free = find_free_time(plans);
      let res = now_in_free(free);
      let btn = document.getElementById('btn_now'), tmsg = document.getElementById('time_left');
      let stbox = document.getElementById('btn_study'), stmsg = document.getElementById('study_left');
      if(res.ok){
        btn.textContent = "지금은 놀 수 있는 시간입니다!";
        btn.className="main-msgbtn ok-msg"; btn.disabled=true;
        tmsg.textContent="놀 수 있는 시간이 "+Math.floor(res.left/60)+"시간 "+(res.left%60)+"분 남았습니다.";
        stbox.style.display="none"; stmsg.style.display="none";
      }else if(res.study){
        btn.textContent = "지금은 놀 수 있는 시간이 아닙니다";
        btn.className="main-msgbtn now-notice"; btn.disabled=true;
        tmsg.textContent="";
        stbox.textContent= "지금은 공부할 시간입니다";
        stbox.style.display="block";
        stmsg.textContent = res.left+"분 더 공부해야 합니다.";
        stmsg.style.display="block";
      }else{
        btn.textContent = "지금은 놀 수 있는 시간이 아닙니다";
        btn.className="main-msgbtn now-notice"; btn.disabled=true;
        tmsg.textContent=(res.next&&res.left>0) ?
          `놀 수 있는 시간까지 ${res.left}분 남았습니다.`:'오늘 일정이 끝났습니다.';
        stbox.style.display="none"; stmsg.style.display="none";
      }
    }
    // 놀 시간 찾기
    function renderPlaytime(){
      let plans = state.plans||[];
      let free = find_free_time(plans);
      let total = 0; free.forEach(f=>total+=f.duration);
      document.getElementById('total_playtime').textContent = Math.floor(total/60)+'시간 '+(total%60)+'분';
      let ul = document.getElementById('list_free'); ul.innerHTML='';
      if(free.length==0){
        ul.innerHTML='<li>빈 시간이 없습니다.</li>';
      }else{
        for(let f of free){
          ul.innerHTML += `<li>${f.start} ~ ${f.end}  (${Math.floor(f.duration/60)}시간 ${f.duration%60}분)</li>`;
        }
      }
      let res = now_in_free(free);
      let box = document.getElementById('now_labelbox'), html="";
      if(res.ok){
        html = `<div class="ok-msg">지금은 놀 수 있는 시간입니다!</div>`;
      }else if(res.study){
        html = `<div class="study-notice">지금은 공부해야 합니다 (${res.left}분 남음)</div>`;
      }else{
        html = `<div class="now-notice">지금은 놀 수 있는 시간이 아닙니다</div>`;
      }
      box.innerHTML = html;
    }
    // 장소
    const placeDB={
      '카페':["별다방","커피왕","스윗하우스","청춘아지트"],
      '공원':["중앙공원","호수공원","솔바람공원","햇살공원"],
      '오락실':["동탄게임랜드","슈퍼펀","레트로존","펀월드"],
      '코인노래방':["코인파티","코노팡팡","노래의민족","뮤직존"]
    };
    function renderPlaceCats(){
      let sel=document.getElementById('catSel');
      sel.innerHTML="<option value='' hidden>고르기</option>";
      for(let c in placeDB){ let o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o);}
      listPlaces();
    }
    function listPlaces(){
      let sel=document.getElementById('catSel');
      let val=sel.value;
      let html="";
      if(val && placeDB[val]){
        placeDB[val].forEach((p,i)=>html+=`<div class="place-li">${i+1}. ${p}</div>`);
      }
      document.getElementById("rec_placebox").innerHTML=html;
    }
    function pickRandomPlace(){
      let cat=document.getElementById('catSel').value;
      if(!cat||!placeDB[cat]) return alert("카테고리를 선택하세요.");
      let arr=placeDB[cat], idx=Math.floor(Math.random()*arr.length);
      let chosen=arr[idx];
      document.getElementById("rec_placebox").innerHTML=
        `<div class="rand-place">추천 장소: ${chosen}</div>`;
      state.lastCat=cat; state.lastPlace=chosen; saveAll();
    }
    // ============ 최적경로 연결 ============
    function renderRoute(){
      // 추천된 장소 자동 표시
      let dest = state.lastPlace||"";
      document.getElementById('destLabel').textContent = dest ? dest : "(추천 후 목적지가 표시됨)";
      document.getElementById('startInput').value = "";
      document.getElementById('routeUrlBox').innerHTML = "";
    }
    function showNaverRoute(){
      let start = document.getElementById("startInput").value.trim();
      let dest = state.lastPlace||"";
      if(!dest){
        alert("놀이 장소 추천에서 먼저 장소를 추천받고 오세요!");
        moveScreen('place');
        return;
      }
      if(!start) { alert("출발 장소를 입력하세요."); return; }
      // 지도 경로 URL (출발지와 목적지 모두 노출)
      let url = "https://map.naver.com/v5/directions/"
        + encodeURIComponent(start) + ",," + "/" + encodeURIComponent(dest) + ",," + "/-/transit";
      let html = `<a href="${url}" target="_blank" style="color:#1976d2;text-decoration:underline;font-weight:bold;">네이버 지도에서 경로 확인(새 창)</a><br>${url}`;
      document.getElementById('routeUrlBox').innerHTML = html;
    }
    window.onload = function(){
      loadAll();
      renderHome();
      renderPlaceCats();
      document.getElementById('userName').addEventListener('change',saveName);
    }
  </script>
</body>
</html>
